---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: author-tools
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: author-tools
  template:
    metadata:
      labels:
        app: author-tools
        workload: app
    spec:
      securityContext:
        fsGroup: 33
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
      initContainers:
        - name: setup-volumes
          image: alpine:latest
          args:
            - -c
            - chmod 770 /tmp;
            - chown -R 33:33 /tmp;
          command:
            - /bin/sh
          volumeMounts:
            - name: at-tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
        - name: yang-modules
          image: "ghcr.io/ietf-tools/author-tools:$APP_IMAGE_TAG"
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -d /yang/.git ]; then
                echo "yang modules present, last update: $(cat /yang/.last-update 2>/dev/null || echo unknown)"
                exit 0
              fi
              git init -q /yang
              git -C /yang remote add origin \
                https://github.com/YangModels/yang.git
              git -C /yang fetch --depth 1 origin main
              git -C /yang sparse-checkout set standard
              git -C /yang checkout -q --force FETCH_HEAD
              git -C /yang submodule update --init --depth 1 \
                standard/bbf standard/mef
              date -u +%Y-%m-%dT%H:%M:%SZ > /yang/.last-update
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: yang-modules
              mountPath: /yang
            - name: at-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 33
            runAsGroup: 33
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      containers:
        - name: author-tools
          image: "ghcr.io/ietf-tools/author-tools:$APP_IMAGE_TAG"
          imagePullPolicy: Always
          command: ["supervisord"]
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: at-tmp
              mountPath: /tmp
            - name: at-kramdown
              mountPath: /tmp/cache/refcache
            - name: at-xml2rfc
              mountPath: /tmp/cache/xml2rfc
            - name: at-idnits
              mountPath: /var/www/.idnits
            - name: at-cache
              mountPath: /var/www/.cache
            - name: at-app-tmp
              mountPath: /usr/src/app/tmp
            - name: yang-modules
              mountPath: /usr/src/app/yang
              readOnly: true
          env:
            - name: "CONTAINER_ROLE"
              value: "author-tools"
            # ensures the pod gets recreated on every deploy:
            - name: "DEPLOY_UID"
              value: "$DEPLOY_UID"
          envFrom:
            - secretRef:
                name: author-tools-secrets-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 33
            runAsGroup: 33
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: at-tmp
          emptyDir:
            sizeLimit: "2Gi"
        - name: at-kramdown
          emptyDir:
            sizeLimit: "1Gi"
        - name: at-xml2rfc
          emptyDir:
            sizeLimit: "1Gi"
        - name: at-idnits
          emptyDir:
            sizeLimit: "1Gi"
        - name: at-cache
          emptyDir:
            sizeLimit: "1Gi"
        - name: at-app-tmp
          emptyDir:
            sizeLimit: "4Gi"
        - name: yang-modules
          persistentVolumeClaim:
            claimName: author-tools-yang
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: author-tools
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: author-tools
