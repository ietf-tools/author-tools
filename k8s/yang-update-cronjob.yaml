---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: author-tools-yang-update
spec:
  schedule: "17 4 * * 1"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: author-tools
            workload: yang-update
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 33
            runAsUser: 33
            runAsGroup: 33
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: author-tools
                      workload: app
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: yang-update
              image: "ghcr.io/ietf-tools/author-tools:$APP_IMAGE_TAG"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  git -C /yang fetch --depth 1 origin main
                  git -C /yang sparse-checkout set standard
                  git -C /yang checkout -q --force FETCH_HEAD
                  git -C /yang submodule update --init --depth 1 \
                    standard/bbf standard/mef
                  git -C /yang gc --prune=now --quiet
                  date -u +%Y-%m-%dT%H:%M:%SZ > /yang/.last-update
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: yang-modules
                  mountPath: /yang
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
          volumes:
            - name: yang-modules
              persistentVolumeClaim:
                claimName: author-tools-yang
            - name: tmp
              emptyDir:
                sizeLimit: "1Gi"
